name: Feature request
description: Suggest an improvement for TAHAI Web Services Browser
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on the browser lane. IT Docs backend work and PSA connector work belong outside this public browser repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What operator/developer/IT workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mission Control / Mission Tabs
        - Multi-view / panes
        - DevOps or IT launch recipes
        - Evidence / export / redaction
        - Packaging / installers
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary check
      options:
        - label: This does not require storing provider/API/PSA secrets in the browser.
          required: true
        - label: This does not require direct PSA API calls from the public browser repo.
          required: true
