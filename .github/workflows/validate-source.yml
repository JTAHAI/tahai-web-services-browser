name: Validate source

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:public-repo
      - run: npm run verify:release-blockers
