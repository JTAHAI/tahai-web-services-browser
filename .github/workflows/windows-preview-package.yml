name: Windows Preview Package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview-package:
    name: Build unsigned Windows preview artifacts
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release blockers
        run: npm run verify:release-blockers
      - name: Build unsigned installer artifacts
        run: npm run package:win:release
      - name: Build friend-feedback bundle
        run: npm run release:friend:zip
      - name: Upload unsigned preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tahai-web-services-browser-unsigned-preview
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.txt
            release/*.yml
