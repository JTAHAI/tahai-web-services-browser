name: Windows preview package

on:
  workflow_dispatch:

jobs:
  windows-preview-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:release-blockers
      - name: Build unsigned Windows preview package
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm run package:win:release
      - uses: actions/upload-artifact@v7
        with:
          name: tahai-browser-windows-preview
          path: release/**
