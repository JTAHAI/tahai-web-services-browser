name: Public release candidate

on:
  workflow_dispatch:

jobs:
  public-release-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run release:public:verify
      - name: Build unsigned public RC
        shell: pwsh
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm run release:public:win
      - uses: actions/upload-artifact@v7
        with:
          name: tahai-browser-public-release-candidate
          path: release/**
