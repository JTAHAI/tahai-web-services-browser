version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      supply-chain:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      supply-chain:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
