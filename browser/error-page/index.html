<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'self'; img-src 'self' file: data:; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" />
  <title>TAHAI Browser Load Issue</title>
  <link rel="icon" href="../new-tab/assets/tws/tws-square-logo.png" />
  <link rel="stylesheet" href="../settings/styles.css" />
</head>
<body>
  <main>
    <section class="hero">
      <img src="../new-tab/assets/tws/tws-square-logo.png" alt="" />
      <div><p class="eyebrow">TAHAI Browser</p><h1>Load issue</h1></div>
    </section>
    <article class="panel">
      <h2>The page did not load cleanly.</h2>
      <p id="reason">The network may be offline, the site may be blocking embedded browser views, or the destination may be unavailable.</p>
      <div class="row"><span>Requested page</span><code id="target">Unknown</code></div>
      <p><a href="https://tahaiportal.com">Return to TAHAI Portal</a></p>
    </article>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('url') || 'Unknown';
    const reason = params.get('reason') || 'The page failed to load.';
    document.getElementById('target').textContent = target;
    document.getElementById('reason').textContent = reason;
  </script>
</body>
</html>
