caption: Allow Local OI Mission ingestion
desc: |-
  Allows typed Mission, runbook, evidence-marker and safe event metadata to enter Local OI when LocalOIEnabled is enabled. It does not collect page content or general browser history.

  When true, typed Mission ingestion is allowed. When false, no new Mission metadata is ingested by Local OI.

  If not configured, the profile setting is used and defaults to enabled. A mandatory policy locks the corresponding setting. These controls apply to regular profiles only; Local OI is unavailable in guest and incognito profiles.
default: true
example_value: true
features:
  dynamic_refresh: true
  per_profile: true
items:
- caption: Allow this Local OI capability
  value: true
- caption: Disable this Local OI capability
  value: false
owners:
- file://chrome/browser/ui/webui/OWNERS
schema:
  type: boolean
supported_on:
- chrome.win:150-
tags: []
type: main
